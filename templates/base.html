<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vault{% endblock %} · Secure Personal Document Vault</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.dashboard') if session.get('user_id') else url_for('auth.login') }}">
      <span class="brand-mark">V</span><span>Secure Vault</span>
    </a>
    {% if session.get('user_id') %}
    <nav>
      <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
      <a href="{{ url_for('documents.documents') }}">My documents</a>
      <a class="button button-small" href="{{ url_for('documents.upload') }}">Upload</a>
      <a class="nav-muted" href="{{ url_for('auth.logout') }}">Sign out</a>
    </nav>
    {% endif %}
  </header>
  <main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
